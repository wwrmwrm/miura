<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="miura">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14110f"/>
      <stop offset="55%" stop-color="#1a1613"/>
      <stop offset="100%" stop-color="#100e0c"/>
    </linearGradient>
    <radialGradient id="wash" cx="82%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#f5efe6" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#e8d5c4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#14110f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ece4"/>
      <stop offset="100%" stop-color="#d4cbc0"/>
    </linearGradient>
    <linearGradient id="vermilion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c45c3e"/>
      <stop offset="100%" stop-color="#a84832"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c4b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c45c3e" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#wash)"/>

  <!-- Quiet grain -->
  <g fill="#f5efe6" fill-opacity="0.022">
    <circle cx="140" cy="90" r="1.1"/><circle cx="380" cy="150" r="0.9"/>
    <circle cx="620" cy="70" r="1"/><circle cx="920" cy="180" r="1.1"/>
    <circle cx="1080" cy="100" r="0.8"/><circle cx="220" cy="420" r="1"/>
    <circle cx="720" cy="500" r="1.1"/><circle cx="1040" cy="540" r="0.9"/>
  </g>

  <!-- Frame -->
  <rect x="48" y="48" width="1184" height="544" fill="none" stroke="#f5efe6" stroke-opacity="0.07" stroke-width="1"/>
  <rect x="56" y="56" width="1168" height="528" fill="none" stroke="#f5efe6" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Right side: minimal sakura (simple geometry, not a broken circle) -->
  <g transform="translate(980, 300)" opacity="0.9">
    <!-- five soft petals -->
    <g fill="url(#petal)" stroke="#e8c4b8" stroke-opacity="0.35" stroke-width="1">
      <ellipse cx="0" cy="-48" rx="22" ry="36" transform="rotate(0)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="36" transform="rotate(72)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="36" transform="rotate(144)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="36" transform="rotate(216)"/>
      <ellipse cx="0" cy="-48" rx="22" ry="36" transform="rotate(288)"/>
    </g>
    <!-- center -->
    <circle cx="0" cy="0" r="10" fill="#c45c3e" fill-opacity="0.45"/>
    <circle cx="0" cy="0" r="4" fill="#f5efe6" fill-opacity="0.35"/>
    <!-- thin stem line, very quiet -->
    <path d="M0 52 C 8 90 18 130 12 168" fill="none" stroke="#a89888" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Distant thin mountain / ink line (ma) -->
  <path
    d="M720 470 C 820 430 900 455 980 420 C 1040 395 1100 410 1180 390"
    fill="none"
    stroke="#f5efe6"
    stroke-opacity="0.08"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Vertical vermilion accent -->
  <rect x="120" y="160" width="2" height="280" fill="url(#vermilion)" opacity="0.85"/>

  <!-- Type -->
  <g font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Times New Roman', Georgia, serif">
    <text x="160" y="248" fill="url(#ink)" font-size="108" font-weight="500" letter-spacing="8">miura</text>
  </g>

  <g font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif">
    <text x="160" y="300" fill="#a89888" font-size="18" font-weight="400" letter-spacing="10">йџі гЃ® дЅ™ з™Ѕ</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="160" y="360" fill="#e8dfd4" font-size="26" font-weight="400" letter-spacing="0.5">
      One player В· every source
    </text>
    <text x="160" y="400" fill="#8a7e72" font-size="16" font-weight="400" letter-spacing="1.5">
      Local  В·  SoundCloud  В·  
    </text>
  </g>

  <!-- Source marks -->
  <g transform="translate(160, 460)" font-family="ui-sans-serif, system-ui, sans-serif">
    <g>
      <rect width="88" height="36" rx="2" fill="none" stroke="#f5efe6" stroke-opacity="0.18"/>
      <text x="44" y="23" text-anchor="middle" fill="#c4b8aa" font-size="12" font-weight="500" letter-spacing="2">LOCAL</text>
    </g>
    <g transform="translate(104,0)">
      <rect width="120" height="36" rx="2" fill="none" stroke="#c45c3e" stroke-opacity="0.55"/>
      <text x="60" y="23" text-anchor="middle" fill="#d4a090" font-size="12" font-weight="500" letter-spacing="1">SOUNDCLOUD</text>
    </g>
</g>

  <!-- Hanko -->
  <g transform="translate(1120, 500)">
    <rect x="0" y="0" width="52" height="52" rx="3" fill="none" stroke="#c45c3e" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="26" y="33" text-anchor="middle" fill="#c45c3e" fill-opacity="0.85" font-size="20" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-weight="600">йџі</text>
  </g>

  <text x="160" y="560" fill="#5c534c" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="2">
    ELECTRON  В·  REACT  В·  TYPESCRIPT  В·  MIT
  </text>
</svg>
